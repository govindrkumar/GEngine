<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="icon" href="image/bulky-hammer-9758173_1280.webp">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <title>GEngine OS</title>
    </head>
    <body>
        <div class="taskbar">
            <img src="image/icons8-ubuntu-48.png" alt="start button">
            <img src="image/icons8-file-explorer-48.png" alt="file explorer" id="img1">
            <img src="image/settings.png" alt="setting" id="img2">
            <img src="image/icons8-music-60.png" alt="music" id="img3">

            <div class="actionbar">
                <div id="wifi">
                    <img src="image/wifi.png" alt="wifi">
                </div>
                <div id="clock"></div>
                <div id="poweroff">
                    <img src="image/poweroff.png" alt="poweroff">
                </div>
            </div>
        </div>
        <div class="start-menu" id="start-menu">
            <div class="menus">
                <ul>
                <li>Music</li>
                <li>Terminal</li>
                <li>Settings</li>
                <li>File Manager</li>
            </ul>
            </div>

        </div>
    </body>
</html>
